openapi: 3.1.0
info:
  title: Layanan Katalog, Kasir POS, dan Kasbon Warung — Warung Ibu Beti
  version: 1.1.0
  contact:
    name: Tim TI Warung Ibu Beti (Kelompok Intel)
    email: ti@warungibubeti.test
  description: |
    Kontrak REST API resmi versi 1.1.0 Warung Ibu Beti.
    Mendukung transaksi kasir POS, filter kategori komoditas, perhitungan margin keuntungan,
    serta pengelolaan utang kasbon pelanggan warung dengan kontrol limit kredit.
    Seluruh galat dikembalikan dalam format standar RFC 9457 Problem Details (application/problem+json).
servers:
  - url: http://localhost:8000/api
    description: Lingkungan Docker Sail Lokal (Port 8000)
  - url: http://localhost/api
    description: Lingkungan Port Default
tags:
  - name: Sembako
    description: Manajemen katalog sembako, pergerakan persediaan, dan margin laba
  - name: Kasbon
    description: Pengelolaan pelanggan dan fasilitas kasbon (utang belanja) warung
paths:
  /v1/barang:
    get:
      tags: [Sembako]
      operationId: daftarBarang
      summary: Menampilkan seluruh komoditas sembako dengan filter kategori
      description: Mengembalikan daftar barang dagangan warung, mendukung filter berdasarkan query parameter `kategori`.
      parameters:
        - name: kategori
          in: query
          required: false
          description: Filter menurut jenis kategori barang
          schema:
            type: string
            enum: [sembako, minuman, bumbu, makanan]
          example: sembako
      responses:
        '200':
          description: Daftar komoditas sembako berhasil diambil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Barang'
    post:
      tags: [Sembako]
      operationId: tambahBarang
      summary: Mendaftarkan komoditas sembako baru ke katalog warung
      description: Kode barang harus unik (format ABC-123). Mengembalikan kode status 201 dan header Location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TambahBarang'
      responses:
        '201':
          description: Komoditas berhasil didaftarkan
          headers:
            Location:
              description: URL detail barang yang baru dibuat
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarangTunggal'
        '422':
          $ref: '#/components/responses/ValidasiGagal'

  /v1/barang/{kode_barang}:
    parameters:
      - $ref: '#/components/parameters/KodeBarang'
    get:
      tags: [Sembako]
      operationId: detailBarang
      summary: Menampilkan detail satu komoditas sembako beserta margin laba
      description: Mengembalikan 404 Problem Details bila kode barang tidak ditemukan.
      responses:
        '200':
          description: Detail informasi komoditas sembako
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarangTunggal'
        '404':
          $ref: '#/components/responses/KomoditasTidakDitemukan'

  /v1/barang/{kode_barang}/catat-transaksi:
    parameters:
      - $ref: '#/components/parameters/KodeBarang'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Sembako]
      operationId: catatTransaksiBarang
      summary: Mencatat transaksi mutasi persediaan kasir atau pesanan WhatsApp
      description: |
        Nilai `perubahan` negatif untuk arus keluar barang (penjualan kasir atau pesanan WhatsApp).
        Persediaan fisik di rak warung dilindungi Pessimistic Lock dan tidak boleh defisit (< 0).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatatTransaksiBarang'
      responses:
        '200':
          description: Transaksi berhasil dicatat dan persediaan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarangTunggal'
        '404':
          $ref: '#/components/responses/KomoditasTidakDitemukan'
        '409':
          description: Persediaan di rak warung tidak mencukupi permintaan transaksi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://warungibubeti.test/problem/persediaan-defisit
                title: Persediaan Sembako Tidak Cukup
                status: 409
                detail: Persediaan barang SBK-001 di rak warung hanya tersisa 3, tidak mencukupi permintaan transaksi 5.
                instance: /api/v1/barang/SBK-001/catat-transaksi
                stok_tersedia: 3
        '422':
          $ref: '#/components/responses/ValidasiGagal'

  /v1/pelanggan:
    get:
      tags: [Kasbon]
      operationId: daftarPelanggan
      summary: Menampilkan daftar pelanggan warung beserta status kasbon
      description: Mengembalikan daftar seluruh pelanggan warung, limit kasbon, dan total kasbon aktif saat ini.
      responses:
        '200':
          description: Daftar pelanggan berhasil diambil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pelanggan'
    post:
      tags: [Kasbon]
      operationId: tambahPelanggan
      summary: Mendaftarkan pelanggan baru warung
      description: Menambahkan pelanggan baru beserta batas limit kasbon yang disetujui.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TambahPelanggan'
      responses:
        '201':
          description: Pelanggan berhasil didaftarkan
          headers:
            Location:
              description: URL detail pelanggan
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PelangganTunggal'
        '422':
          $ref: '#/components/responses/ValidasiGagal'

  /v1/pelanggan/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID unik pelanggan di warung
        schema:
          type: integer
        example: 1
    get:
      tags: [Kasbon]
      operationId: detailPelanggan
      summary: Menampilkan profil dan limit kasbon pelanggan
      description: Mengembalikan profil satu pelanggan warung beserta detail limit kasbon aktif.
      responses:
        '200':
          description: Detail pelanggan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PelangganTunggal'
        '404':
          $ref: '#/components/responses/PelangganTidakDitemukan'

  /v1/pelanggan/{id}/bayar-kasbon:
    parameters:
      - name: id
        in: path
        required: true
        description: ID unik pelanggan
        schema:
          type: integer
        example: 1
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Kasbon]
      operationId: bayarKasbonPelanggan
      summary: Mencatat pembayaran / cicilan kasbon pelanggan
      description: |
        Mengurangi total utang kasbon pelanggan.
        Aturan bisnis: Nominal pembayaran tidak boleh melebihi sisa kasbon aktif (total kasbon tidak boleh minus < 0).
        Jika pembayaran melebihi utang, sistem menolak dengan 409 Conflict Problem Details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nominal]
              properties:
                nominal:
                  type: integer
                  minimum: 1000
                  example: 50000
                keterangan:
                  type: string
                  maxLength: 255
                  example: Cicilan kasbon gajian minggu ke-3
      responses:
        '200':
          description: Pembayaran kasbon berhasil dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KasbonTunggal'
        '404':
          $ref: '#/components/responses/PelangganTidakDitemukan'
        '409':
          description: Pembayaran melebihi total kasbon aktif (tidak boleh minus)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://warungibubeti.test/problem/pembayaran-kasbon-melebihi-utang
                title: Pembayaran Melebihi Utang Kasbon
                status: 409
                detail: Pembayaran ditolak. Pelanggan Pak Joko hanya memiliki kasbon aktif sebesar Rp 30.000. Pembayaran Rp 50.000 melebihi utang.
                instance: /api/v1/pelanggan/1/bayar-kasbon
                pelanggan_id: 1
                kasbon_aktif: 30000
                nominal_bayar: 50000
        '422':
          $ref: '#/components/responses/ValidasiGagal'

  /v1/pelanggan/{id}/kasbon:
    parameters:
      - name: id
        in: path
        required: true
        description: ID unik pelanggan
        schema:
          type: integer
        example: 1
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Kasbon]
      operationId: catatKasbonPelanggan
      summary: Mencatat transaksi utang belanja (kasbon) pelanggan
      description: |
        Fitur khas Warung Ibu Beti: mencatat pembelian tempo/utang pelanggan.
        Jika akumulasi kasbon melebihi limit yang ditentukan, sistem menolak dengan galat 409 Conflict Problem Details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatatKasbon'
      responses:
        '201':
          description: Kasbon pelanggan berhasil dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KasbonTunggal'
        '404':
          $ref: '#/components/responses/PelangganTidakDitemukan'
        '409':
          description: Total kasbon melebihi batas limit pelanggan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://warungibubeti.test/problem/batas-kasbon-terlampaui
                title: Limit Kasbon Pelanggan Terlampaui
                status: 409
                detail: Kasbon ditolak. Pelanggan Pak Joko memiliki kasbon aktif Rp 85.000, tambahan kasbon Rp 30.000 melebihi limit Rp 100.000.
                instance: /api/v1/pelanggan/1/kasbon
                pelanggan_id: 1
                kasbon_aktif: 85000
                limit_kasbon: 100000
        '422':
          $ref: '#/components/responses/ValidasiGagal'

components:
  parameters:
    KodeBarang:
      name: kode_barang
      in: path
      required: true
      description: Kode unik komoditas sembako (format ABC-123)
      schema:
        type: string
        pattern: '^[A-Z]{3}-[0-9]{3}$'
      example: SBK-001

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Kunci unik transaksi untuk mencegah duplikasi eksekusi pada jaringan tidak stabil
      schema:
        type: string
      example: KB-20261019-001

  schemas:
    Barang:
      type: object
      required: [kode_barang, nama, kategori, harga_beli, harga_jual, margin_persen, stok, tersedia, diperbarui_pada]
      properties:
        kode_barang:
          type: string
          example: SBK-001
        nama:
          type: string
          example: Beras Rojo Lele 5kg
        kategori:
          type: string
          example: sembako
        harga_beli:
          type: integer
          minimum: 0
          description: Harga modal kulakan dalam rupiah
          example: 62000
        harga_jual:
          type: integer
          minimum: 0
          description: Harga eceran penjualan warung
          example: 72000
        margin_persen:
          type: number
          description: Persentase keuntungan kotor terhadap modal (fitur v1.1.0)
          example: 16.1
        stok:
          type: integer
          minimum: 0
          example: 15
        tersedia:
          type: boolean
          example: true
        diperbarui_pada:
          type: string
          format: date-time

    BarangTunggal:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Barang'

    TambahBarang:
      type: object
      required: [kode_barang, nama, harga_beli, harga_jual]
      properties:
        kode_barang:
          type: string
          pattern: '^[A-Z]{3}-[0-9]{3}$'
          example: SBK-001
        nama:
          type: string
          maxLength: 120
          example: Beras Rojo Lele 5kg
        kategori:
          type: string
          enum: [sembako, minuman, bumbu, makanan]
          example: sembako
        harga_beli:
          type: integer
          minimum: 0
          example: 62000
        harga_jual:
          type: integer
          minimum: 0
          example: 72000
        stok:
          type: integer
          minimum: 0
          default: 0
          example: 15

    CatatTransaksiBarang:
      type: object
      required: [perubahan, jenis_transaksi]
      properties:
        perubahan:
          type: integer
          not:
            const: 0
          example: -4
        jenis_transaksi:
          type: string
          enum: [penjualan_kasir, pesanan_wa, kulakan_gudang, retur_rusak]
          example: penjualan_kasir

    Pelanggan:
      type: object
      required: [id, nama, limit_kasbon, total_kasbon, sisa_limit, dibuat_pada]
      properties:
        id:
          type: integer
          example: 1
        nama:
          type: string
          example: Pak Joko Tetangga Depan
        nomor_wa:
          type: string
          nullable: true
          example: '081234567890'
        limit_kasbon:
          type: integer
          example: 150000
        total_kasbon:
          type: integer
          example: 45000
        sisa_limit:
          type: integer
          example: 105000
        dibuat_pada:
          type: string
          format: date-time

    PelangganTunggal:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Pelanggan'

    TambahPelanggan:
      type: object
      required: [nama]
      properties:
        nama:
          type: string
          maxLength: 100
          example: Pak Joko Tetangga Depan
        nomor_wa:
          type: string
          nullable: true
          example: '081234567890'
        limit_kasbon:
          type: integer
          minimum: 0
          default: 150000
          example: 150000

    CatatKasbon:
      type: object
      required: [nominal, keterangan]
      properties:
        nominal:
          type: integer
          minimum: 1000
          example: 35000
        keterangan:
          type: string
          maxLength: 255
          example: Beras 2kg dan Telur 1/2 kg

    KasbonTunggal:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, id_transaksi_kasbon, pelanggan_id, nominal, keterangan, tercatat_pada]
          properties:
            id:
              type: integer
              example: 1
            id_transaksi_kasbon:
              type: string
              example: KB-20261019-001
            pelanggan_id:
              type: integer
              example: 1
            nominal:
              type: integer
              example: 35000
            keterangan:
              type: string
              example: Beras 2kg dan Telur 1/2 kg
            tercatat_pada:
              type: string
              format: date-time

    Problem:
      type: object
      description: Format Problem Details sesuai RFC 9457
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        stok_tersedia:
          type: integer
        pelanggan_id:
          type: integer
        kasbon_aktif:
          type: integer
        limit_kasbon:
          type: integer

  responses:
    KomoditasTidakDitemukan:
      description: Barang dengan kode tersebut tidak ditemukan di warung
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PelangganTidakDitemukan:
      description: Pelanggan tidak terdaftar di buku warung
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidasiGagal:
      description: Parameter atau isi permintaan melanggar aturan kontrak
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
