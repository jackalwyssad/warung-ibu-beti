openapi: 3.1.0
info:
  title: Layanan Katalog, Persediaan Sembako, dan Transaksi — Warung Ibu Beti
  version: 1.0.0
  contact:
    name: Tim TI Warung Ibu Beti (Kelompok Intel)
    email: ti@warungibubeti.test
  description: |
    Kontrak REST API resmi untuk membaca katalog sembako, mengelola persediaan fisik rak warung,
    dan mencatat transaksi kasir POS serta pesanan bot WhatsApp Warung Ibu Beti.
    Seluruh galat dikembalikan dalam format standar RFC 9457 Problem Details (application/problem+json).
servers:
  - url: http://localhost:8000/api
    description: Lingkungan Docker Sail Lokal (Port 8000)
  - url: http://localhost/api
    description: Lingkungan Port Default
tags:
  - name: Sembako
    description: Manajemen komoditas sembako dan mutasi transaksi kasir Warung Ibu Beti
paths:
  /v1/barang:
    get:
      tags: [Sembako]
      operationId: daftarBarang
      summary: Menampilkan seluruh komoditas sembako beserta sisa persediaan
      description: Mengembalikan seluruh data barang dagangan warung, diurutkan menurut kode barang.
      responses:
        '200':
          description: Daftar komoditas sembako berhasil diambil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Barang'
    post:
      tags: [Sembako]
      operationId: tambahBarang
      summary: Menambahkan komoditas sembako baru ke warung
      description: Kode barang harus unik (format ABC-123). Bila nilai `stok` tidak dikirim, stok awal dianggap 0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TambahBarang'
      responses:
        '201':
          description: Komoditas berhasil didaftarkan
          headers:
            Location:
              description: URL detail barang yang baru dibuat
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarangTunggal'
        '422':
          $ref: '#/components/responses/ValidasiGagal'

  /v1/barang/{kode_barang}:
    parameters:
      - $ref: '#/components/parameters/KodeBarang'
    get:
      tags: [Sembako]
      operationId: detailBarang
      summary: Menampilkan detail satu komoditas sembako berdasarkan kode barang
      description: Mengembalikan kode galat 404 Problem Details jika komoditas tidak ditemukan di katalog warung.
      responses:
        '200':
          description: Detail informasi komoditas sembako
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarangTunggal'
        '404':
          $ref: '#/components/responses/KomoditasTidakDitemukan'

  /v1/barang/{kode_barang}/catat-transaksi:
    parameters:
      - $ref: '#/components/parameters/KodeBarang'
    post:
      tags: [Sembako]
      operationId: catatTransaksiBarang
      summary: Mencatat transaksi mutasi persediaan barang sembako
      description: |
        Nilai `perubahan` negatif untuk arus keluar (penjualan kasir atau pesanan WhatsApp),
        dan positif untuk arus masuk (kulakan gudang atau retur). Sisa persediaan rak warung tidak boleh defisit (< 0).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatatTransaksiBarang'
      responses:
        '200':
          description: Transaksi berhasil dicatat dan persediaan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarangTunggal'
        '404':
          $ref: '#/components/responses/KomoditasTidakDitemukan'
        '409':
          description: Persediaan di warung tidak mencukupi permintaan transaksi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://warungibubeti.test/problem/persediaan-defisit
                title: Persediaan Sembako Tidak Cukup
                status: 409
                detail: Persediaan barang SBK-001 di rak warung hanya tersisa 3, tidak mencukupi permintaan transaksi 5.
                instance: /api/v1/barang/SBK-001/catat-transaksi
                stok_tersedia: 3
        '422':
          $ref: '#/components/responses/ValidasiGagal'

components:
  parameters:
    KodeBarang:
      name: kode_barang
      in: path
      required: true
      description: Kode unik komoditas sembako (format ABC-123)
      schema:
        type: string
        pattern: '^[A-Z]{3}-[0-9]{3}$'
      example: SBK-001

  schemas:
    Barang:
      type: object
      required: [kode_barang, nama, kategori, harga, stok, tersedia, diperbarui_pada]
      properties:
        kode_barang:
          type: string
          example: SBK-001
        nama:
          type: string
          example: Beras Rojo Lele 5kg
        kategori:
          type: string
          example: sembako
        harga:
          type: integer
          minimum: 0
          description: Harga eceran warung dalam rupiah (tanpa desimal)
          example: 72000
        stok:
          type: integer
          minimum: 0
          description: Jumlah stok fisik di rak warung
          example: 15
        tersedia:
          type: boolean
          description: Indikator cepat ketersediaan stok (true bila stok > 0)
          example: true
        diperbarui_pada:
          type: string
          format: date-time

    BarangTunggal:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Barang'

    TambahBarang:
      type: object
      required: [kode_barang, nama, harga]
      properties:
        kode_barang:
          type: string
          pattern: '^[A-Z]{3}-[0-9]{3}$'
          example: SBK-001
        nama:
          type: string
          maxLength: 120
          example: Beras Rojo Lele 5kg
        kategori:
          type: string
          enum: [sembako, minuman, bumbu, makanan]
          example: sembako
        harga:
          type: integer
          minimum: 0
          example: 72000
        stok:
          type: integer
          minimum: 0
          default: 0
          example: 15

    CatatTransaksiBarang:
      type: object
      required: [perubahan, jenis_transaksi]
      properties:
        perubahan:
          type: integer
          not:
            const: 0
          example: -4
        jenis_transaksi:
          type: string
          enum: [penjualan_kasir, pesanan_wa, kulakan_gudang, retur_rusak]
          example: penjualan_kasir

    Problem:
      type: object
      description: Format Problem Details sesuai RFC 9457
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: object
          description: Rincian galat validasi per field
          additionalProperties:
            type: array
            items:
              type: string
        stok_tersedia:
          type: integer
          description: Sisa stok fisik saat galat 409 terjadi

  responses:
    KomoditasTidakDitemukan:
      description: Barang dengan kode tersebut tidak ditemukan di warung
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidasiGagal:
      description: Parameter atau isi permintaan melanggar aturan kontrak
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
